<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}ElderGuard Medical Summary{% endblock %}</title>
  <style>
    :root { --teal: #00838F; --navy: #0F2A44; --muted: #5B6B7B; --line: #DDE5EA; --red: #C62828; --amber: #B26A00; --green: #2E7D32; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #F4F7F9; color: var(--navy); font: 14px/1.45 "Segoe UI", Roboto, Arial, sans-serif; }
    .page { max-width: 820px; margin: 24px auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 28px 32px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--teal); padding-bottom: 12px; margin-bottom: 16px; gap: 16px; }
    h1 { margin: 0; font-size: 22px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--teal); margin: 18px 0 8px; }
    .meta { color: var(--muted); font-size: 12px; text-align: right; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 16px; }
    .field span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .field b { font-size: 15px; }
    .alert { background: #FDECEA; border: 1px solid #F5C2BE; color: var(--red); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    th { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .st-critical { color: var(--red); font-weight: 700; }
    .st-warning { color: var(--amber); font-weight: 700; }
    .st-normal, .st-optimal { color: var(--green); }
    ul { margin: 0; padding-left: 18px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
    footer { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 11px; color: var(--muted); }
    .print-btn { background: var(--teal); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
    @media (max-width: 640px) { .page { margin: 0; border-radius: 0; padding: 18px 16px; } .grid { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } header { flex-direction: column; } .meta { text-align: left; } }
    /* One A4 page for the consulting doctor (FR-24) */
    @page { size: A4; margin: 12mm; }
    @media print {
      body { background: #fff; font-size: 11.5px; }
      .page { margin: 0; border: 0; padding: 0; max-width: none; }
      .no-print { display: none !important; }
      h2 { margin: 10px 0 4px; }
      th, td { padding: 3px 6px; }
      section, table, tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="page">{% block content %}{% endblock %}</main>
</body>
</html>
