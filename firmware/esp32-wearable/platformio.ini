; ElderGuard AI wearable firmware (ESP32-S3-N16R8 + MAX30102 + MPU6050 + DS18B20)
; Build/flash: pio run -t upload    Serial monitor: pio device monitor
; Connect the board's "COM" (UART) USB-C port; Serial output goes there.

[env:esp32-s3-n16r8]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; DIO, not QIO: this board's flash chip (manufacturer ID 1c) hangs at boot in QIO mode
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    h2zero/NimBLE-Arduino@^2.5.2
